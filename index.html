<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time CanSat Sensors Data</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }
        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo {
            height: 60px;
            margin-right: 50px;
        }
        .chart-container {
            width: 80%;
            height: 400px; /* Fixed height for the chart */
            margin: 20px auto;
        }
        #sensorChart {
            width: 100% !important;
            height: 100% !important;
        }
        .table-container {
            max-height: 600px; /* Increased height */
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #333;
            color: white;
            position: sticky;
            top: 0;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .team {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <img src="nuu_logo.png" alt="Project Logo" class="logo">
        <h1>Real-Time CanSat Sensors Data</h1>
    </header>
    
    <div class="chart-container">
        <label for="chartSelect">Select Parameter:</label>
        <select id="chartSelect">
            <option value="1">Temperature (°C)</option>
            <option value="2">Pressure (hPa)</option>
            <option value="3">Altitude (m)</option>
            <option value="4">Humidity (%)</option>
            <option value="5">Acceleration X (m/s²)</option>
            <option value="6">Acceleration Y (m/s²)</option>
            <option value="7">Acceleration Z (m/s²)</option>
            <option value="8">Velocity X (m/s)</option>
            <option value="9">Velocity Y (m/s)</option>
            <option value="10">Velocity Z (m/s)</option>
            <option value="11">Air Quality</option>
        </select>
        <canvas id="sensorChart"></canvas>
    </div>

    <div class="table-container">
        <table id="sensorDataTable">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Temperature (°C)</th>
                    <th>Pressure (hPa)</th>
                    <th>Altitude (m)</th>
                    <th>Humidity (%)</th>
                    <th>Acceleration X (m/s²)</th>
                    <th>Acceleration Y (m/s²)</th>
                    <th>Acceleration Z (m/s²)</th>
                    <th>Velocity X (m/s)</th>
                    <th>Velocity Y (m/s)</th>
                    <th>Velocity Z (m/s)</th>
                    <th>Air Quality</th>
                    <th>Latitude</th>
                    <th>Longitude</th>
                </tr>
            </thead>
            <tbody id="dataBody">
                <!-- Data will be inserted here -->
            </tbody>
        </table>
    </div>

    <div class="team">
        Project Team: Azam, Samira, Jasurbek, ... 
    </div>

    <script>
        let chart;
        async function fetchData() {
            try {
                const response = await fetch('cansat_data.csv');
                const data = await response.text();
                const rows = data.trim().split('\n');
                const tableBody = document.getElementById('dataBody');
                tableBody.innerHTML = ''; // Clear old data
                const labels = [];
                const values = [];
                const selectedIndex = document.getElementById("chartSelect").value;
                
                rows.slice(1).forEach(row => {
                    const cols = row.split(',');
                    const newRow = tableBody.insertRow();
                    cols.forEach(cell => {
                        const newCell = newRow.insertCell();
                        newCell.textContent = cell;
                    });
                    labels.push(cols[0]); // Timestamp
                    values.push(parseFloat(cols[selectedIndex]));
                });
                
                updateChart(labels, values);
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function updateChart(labels, data) {
            if (chart) {
                chart.destroy();
            }
            const ctx = document.getElementById('sensorChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: document.getElementById("chartSelect").options[document.getElementById("chartSelect").selectedIndex].text,
                        data: data,
                        borderColor: 'blue',
                        borderWidth: 2,
                        fill: false,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        document.getElementById("chartSelect").addEventListener("change", fetchData);
        setInterval(fetchData, 10000); // Update every 10 seconds
        fetchData();
    </script>
</body>
</html>
